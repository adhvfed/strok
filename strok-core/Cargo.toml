[package]
name = "strok-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Document model, parser, geometry, and inspection engine for Strøk"

[dependencies]
bincode = "3.0"
rand = "0.9.4"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Vector boolean operations use i_overlay's robust f64 polygon engine.
# core (the roadmap's lean). kurbo is already in the workspace tree transitively
# via usvg/tiny-skia (the pinned render chain), so taking it as a direct dep for
# bézier flattening + stroke→outline + offset adds no new transitive crates.
# Pinned to the in-tree kurbo (0.13) so boolean/stroke geometry stays
# reproducible alongside the render chain.
i_overlay = "=8.0.0"
kurbo = "=0.13.1"

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "resolve_bench"
harness = false

[lints]
workspace = true
