[package]
name = "strok-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
strok-core = { path = "../strok-core" }

[[bin]]
name = "fuzz_dsl_parse"
path = "fuzz_targets/fuzz_dsl_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false
bench = false

# cargo-fuzz crates live OUTSIDE the main workspace: they require nightly +
# libfuzzer's instrumentation profile, which must not perturb the stable
# workspace build. `[workspace]` here makes this its own workspace root.
[workspace]
